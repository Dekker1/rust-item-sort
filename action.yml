name: 'rust-item-sort'
description: 'Check that Rust items are sorted in an opinionated order (mod, use, const/static, types, fn, impl).'
author: 'Jip J. Dekker'

branding:
  icon: 'check-square'
  color: 'orange'

inputs:
  version:
    description: 'Version of rust-item-sort to install (e.g. "0.1.0"). Defaults to the latest published version.'
    required: false
    default: 'latest'
  args:
    description: 'Extra arguments forwarded to `cargo item-sort --check` (e.g. "-p my_crate" or "--all").'
    required: false
    default: ''
  working-directory:
    description: 'Directory in which to run the check. Defaults to the repository root.'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry and install root
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.cargo/bin/cargo-item-sort
          ~/.cargo/bin/rust-item-sort
        key: rust-item-sort-${{ inputs.version }}-${{ runner.os }}

    - name: Install rust-item-sort
      shell: bash
      run: |
        if ! command -v cargo-item-sort &>/dev/null; then
          if [ "${{ inputs.version }}" = "latest" ]; then
            cargo install rust-item-sort
          else
            cargo install rust-item-sort --version "${{ inputs.version }}"
          fi
        fi

    - name: Check item sort
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: cargo item-sort --check ${{ inputs.args }}
