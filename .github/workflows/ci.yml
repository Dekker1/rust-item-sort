name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  item-sort:
    name: Item sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Dekker1/rust-item-sort@develop
        with:
          args: --all
